name: Cerca e scarica foto da Wikimedia
on:
  push:
    paths: ["photos/requests.txt", "photos/searches.txt", "scripts/wikimedia.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/wikimedia.py
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add photos
          git diff --cached --quiet || git commit -m "Foto da Wikimedia"
          git push
